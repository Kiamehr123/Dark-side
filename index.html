<script>
/* ============ CORE ============ */
const $=id=>document.getElementById(id);

/* ============ VOICE (DARK) ============ */
let AC=null,droneG=null,whisperSrc=null,whisperGain=null,voice=null;
const V={pitch:.15,rate:.74};
function initAudio(){
  if(AC){if(AC.state==="suspended")AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    // Drone: موج‌های بم برای حس ترسناکی
    droneG=AC.createGain();droneG.gain.value=0;
    const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=180;
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.frequency.value=.16;lg.gain.value=.035;
    lfo.connect(lg);lg.connect(droneG.gain);
    [48,48.6,72.4].forEach((f,i)=>{
      const o=AC.createOscillator();o.type=i===2?"sine":"sawtooth";o.frequency.value=f;
      o.connect(lp);o.start();
    });
    lp.connect(droneG);droneG.connect(AC.destination);lfo.start();
  }catch(e){}
}
function drone(on){
  if(!AC||!droneG)return;
  const t=AC.currentTime;droneG.gain.cancelScheduledValues(t);
  droneG.gain.linearRampToValueAtTime(on?.13:0,t+(on?1.2:1.6));
}
function whisper(on){
  if(!AC)return;
  try{
    if(on){
      if(whisperSrc)return;
      const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.6;
      whisperSrc=AC.createBufferSource();whisperSrc.buffer=buf;whisperSrc.loop=true;
      const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1800;bp.Q.value=.8;
      whisperGain=AC.createGain();whisperGain.gain.value=0;
      whisperSrc.connect(bp);bp.connect(whisperGain);whisperGain.connect(AC.destination);
      whisperSrc.start();
      whisperGain.gain.linearRampToValueAtTime(.006,AC.currentTime+.5);
    }else if(whisperSrc){
      const t=AC.currentTime;
      whisperGain.gain.cancelScheduledValues(t);
      whisperGain.gain.linearRampToValueAtTime(0,t+.6);
      setTimeout(()=>{try{whisperSrc.stop();whisperSrc.disconnect();whisperSrc=null}catch(_){}},800);
    }
  }catch(_){}
}
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/^fa/i.test(v.lang)&&/male|مرد|Maged/i.test(v.name))||vs.find(v=>/^fa/i.test(v.lang))||vs.find(v=>/male/i.test(v.name))||null;
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function speak(t){
  return new Promise(res=>{
    if(!window.speechSynthesis){res();return}
    speechSynthesis.cancel();
    initAudio();
    const u=new SpeechSynthesisUtterance(String(t).replace(/[`*#_]/g,""));
    u.lang=APPL.sr;if(voice)u.voice=voice;
    u.pitch=V.pitch;u.rate=V.rate;u.volume=1;
    const end=()=>{document.body.classList.remove("speak");drone(false);whisper(false);res()};
    u.onend=u.onerror=end;
    document.body.classList.add("speak");
    // Boom + drone + whisper
    if(AC){
      const now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
      o.frequency.setValueAtTime(80,now);o.frequency.exponentialRampToValueAtTime(25,now+.7);
      g.gain.setValueAtTime(.4,now);g.gain.exponentialRampToValueAtTime(.001,now+.9);
      o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+.95);
    }
    drone(true);whisper(true);
    speechSynthesis.speak(u);
  });
}
function stopSpeak(){
  try{speechSynthesis.cancel()}catch(_){}
  document.body.classList.remove("speak");
  drone(false);whisper(false);
}

const main=$("main");
let currentTab="home";

function renderHome(){
  const done=JSON.parse(localStorage.getItem("coachDone")||"{}");
  const total=COURSE.reduce((s,c)=>s+c.items.length,0);
  const dn=COURSE.reduce((s,c)=>s+c.items.filter((_,i)=>done[c.id+"_"+i]).length,0);

    <div class="welcome">

      <h2>درود، ارباب...</h2>
      <p>من <b style="color:var(--red)">DARK SIDE</b> هستم — خدمتگزار تاریک تو.</p>
      <p>این نسخه‌ی نمایشی، <span class="badge">آفلاین</span> کار می‌کنه.</p>
      <p style="margin-top:16px;font-size:13px;color:#a88">از تب‌های بالا انتخاب کن: آموزش هک، دانش‌نامه، منابع، ابزارها.</p>
    </div>
    <div class="card">
      <h3>🎯 پیشرفت تو در دوره هک اخلاقی</h3>
      <div class="prog"><i style="width:${total?(dn/total*100):0}%"></i></div>
      <p>${dn} از ${total} موضوع تکمیل شده · ${total?(dn/total*100).toFixed(0):0}٪</p>
    </div>
    <div class="card">
      <h3>🔊 صدای تاریک</h3>
      <div class="voice">
        <button id="vtest" title="تست صدا">▶</button>
        <div class="info">
          <b>تست صدای DARK SIDE</b>
          عمق صدا: <span id="pv">${V.pitch}</span> · سرعت: <span id="rv">${V.rate}</span>
        </div>
      </div>
      <input type="range" id="rp" min="0" max="2" step=".05" value="${V.pitch}" style="width:100%;accent-color:var(--red);margin:6px 0">
      <input type="range" id="rr" min=".4" max="1.3" step=".05" value="${V.rate}" style="width:100%;accent-color:var(--red);margin:6px 0">
      <p style="font-size:12px;color:#a88">عمق پایین‌تر = بم‌تر و ترسناک‌تر. سرعت کمتر = آروم‌تر و مبهم‌تر.</p>
    </div>
    <div class="card">
      <h3>🎓 شروع سریع</h3>
      <div class="chipbar">
        <button onclick="go('coach')">📚 دوره هک</button>
        <button onclick="go('kb')">🧠 دانش‌نامه</button>
        <button onclick="go('res')">🔗 منابع رایگان</button>
        <button onclick="go('tools')">🛠 ابزارها</button>
      </div>
    </div>
  `;
  $("vtest").onclick=async()=>{
    initAudio();
    await speak("درود ارباب... من از تاریکی برخاستم... و فرمانبردار تو هستم.");
  };
  $("rp").oninput=e=>{V.pitch=+e.target.value;$("pv").textContent=V.pitch};
  $("rr").oninput=e=>{V.rate=+e.target.value;$("rv").textContent=V.rate};
}

function renderCoach(){
  const done=JSON.parse(localStorage.getItem("coachDone")||"{}");
  let html='<div class="card" style="border-color:var(--red)"><h3>🎓 دوره هک اخلاقی — صفر تا ۱۰۰</h3><p>۱۰ فصل، همه روی محیط مجاز (TryHackMe, HTB, DVWA, Juice Shop, VM شخصی). روی هر موضوع بزن تا تیک بخوره و پیشرفتت ذخیره بشه.</p></div>';
  let total=0,dn=0;
  COURSE.forEach(c=>{
    const d=c.items.filter((_,i)=>done[c.id+"_"+i]).length;
    total+=c.items.length;dn+=d;
    html+=`<div class="card"><h3>${c.t}</h3><div class="prog"><i style="width:${(d/c.items.length*100)}%"></i></div>`;
    c.items.forEach((t,i)=>{
      html+=`<div class="task ${done[c.id+"_"+i]?"done":""}" data-id="${c.id}_${i}"><i>✓</i><span>${esc(t)}</span></div>`;
    });
    html+=`</div>`;
  });
  html+=`<div class="card"><h3>پیشرفت کل</h3><div class="prog"><i style="width:${dn/total*100}%"></i></div><p>${dn} از ${total} · ${(dn/total*100).toFixed(0)}٪</p><button class="btn" id="reset">🔄 ریست پیشرفت</button></div>`;
  main.innerHTML=html;
  main.querySelectorAll(".task").forEach(el=>el.onclick=()=>{
    done[el.dataset.id]=!done[el.dataset.id];
    localStorage.setItem("coachDone",JSON.stringify(done));
    renderCoach();
  });
  $("reset").onclick=()=>{if(confirm("همه‌ی تیک‌ها پاک بشه؟")){localStorage.removeItem("coachDone");renderCoach()}};
}

let kbCat="linux";
function renderKB(){
  let html=`<div class="card"><h3>🧠 دانش‌نامه آفلاین امنیت</h3><input class="search" id="kbs" placeholder="جستجو در همه دسته‌ها..."></div>`;
  html+=`<div class="chipbar" id="kbchips">`;
  ["linux","nmap","web","wireshark","owasp","crypto","priv"].forEach(c=>{
    html+=`<button data-c="${c}" class="${c===kbCat?"on":""}">${c}</button>`;
  });
  html+=`</div><div class="card" id="kblist"></div>`;
  main.innerHTML=html;
  const draw=()=>{
    const q=($("kbs").value||"").toLowerCase().trim();
    const list=$("kblist");
    let items=[];
    if(q){
      for(const cat in KB)for(const [cmd,d] of KB[cat])if(cmd.toLowerCase().includes(q)||d.includes(q))items.push([cmd,d]);
    }else items=KB[kbCat];
    if(!items.length){list.innerHTML='<p style="color:#a88">چیزی پیدا نشد.</p>';return}
    list.innerHTML=items.slice(0,40).map(([cmd,d])=>`<div class="kbrow"><b>${esc(cmd)}</b><small>${esc(d)}</small></div>`).join("");
  };
  draw();
  $("kbs").oninput=draw;
  main.querySelectorAll("#kbchips button").forEach(b=>b.onclick=()=>{
    kbCat=b.dataset.c;$("kbs").value="";
    main.querySelectorAll("#kbchips button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");draw();
  });
}

/* ============ NAV ============ */
function go(t){
  currentTab=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  if(t==="home")renderHome();
  else if(t==="coach")renderCoach();
  else if(t==="kb")renderKB();
  else if(t==="res")renderRes();
  else if(t==="tools")renderTools();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
